
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Create your Lumio account and start your free trial."
    >

    <meta name="theme-color" content="#464B71">

    <title>Sign up | Lumio</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <main class="signup-card">

        <header class="signup-header">
            <h1>Lumio</h1>
            <h2>Create your account</h2>
            <p>Start your 30-day free trial</p>
        </header>

        <form id="signup-form" novalidate>

            <div class="input-info">

                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        aria-describedby="email-error"
                        required
                    >

                    <p id="email-error" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            aria-describedby="password-rules"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            class="show"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <i
                                class="fa-solid fa-eye"
                                aria-hidden="true"
                            ></i>
                        </button>
                    </div>

                    <div class="rules" id="password-rules">

                        <h3>Your password must have:</h3>

                        <p id="rule1">
                            <span class="rule-icon">✗</span>
                            Minimum 8 characters
                        </p>

                        <p id="rule2">
                            <span class="rule-icon">✗</span>
                            At least one uppercase letter
                        </p>

                        <p id="rule3">
                            <span class="rule-icon">✗</span>
                            At least one numeric digit
                        </p>

                        <p id="rule4">
                            <span class="rule-icon">✗</span>
                            At least one special character
                        </p>

                    </div>

                    <p id="password-error" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="confirm-password">
                        Confirm password
                    </label>

                    <input
                        id="confirm-password"
                        name="confirmPassword"
                        type="password"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required
                    >

                    <p
                        id="confirm-password-error"
                        class="error-message"
                    ></p>
                </div>

            </div>

            <div class="buttons">

                <button id="get-start" type="submit">
                    Create account
                </button>

                <button id="google-signup" type="button">
                    <i
                        class="fa-brands fa-google"
                        aria-hidden="true"
                    ></i>
                    Sign up with Google
                </button>

            </div>

            <p class="already">
                Already have an account?
                <a href="#" id="login-link">Log in</a>
            </p>

            <p
                id="form-message"
                class="form-message"
                role="status"
                aria-live="polite"
            ></p>

        </form>

    </main>

    <script src="script.js"></script>

</body>

</html>
